<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' file: data:" />
    <title>petmarket stage</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }
      #stage {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .pet {
        position: absolute;
        pointer-events: auto;
        cursor: grab;
        touch-action: none;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        -webkit-user-drag: none;
      }
      .pet[data-dragging='true'] {
        cursor: grabbing;
      }
      .pet.bubble {
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.28));
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="./stage.js"></script>
  </body>
</html>
